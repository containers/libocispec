name: Test

on: [push, pull_request]

jobs:
  build_native:
    runs-on: ${{ matrix.runner }}
    name: Build on ${{ matrix.runner }}

    strategy:
      matrix:
        runner: [ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          set-safe-directory: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y automake libtool autotools-dev libjson-c-dev

      - name: Generate build system
        run: NOCONFIGURE=1 ./autogen.sh

      - name: Build
        run: &build |
          find $(pwd) -name '.git' -exec bash -c 'git config --global --add safe.directory ${0%/.git}' {} \;
          ./configure CFLAGS='-Wall -Wextra -Werror'
          # Run make check first to catch test failures with accessible logs
          make -j $(nproc)
          make -j $(nproc) check || (cat test-suite.log 2>/dev/null; exit 1)

      # Distribution validation does not depend on the architecture,
      # so only do it here and not in (slow) emulated builds.
      - name: Distcheck
        run: |
          make -j $(nproc) distcheck
          # check that the working dir is clean
          git describe --broken --dirty --all | grep -qv dirty
          make clean

  build_emulated:
    runs-on: ubuntu-latest
    name: Build on ${{ matrix.arch }}

    strategy:
      matrix:
        include:
          - arch: armv7
            distro: ubuntu24.04
          - arch: s390x
            distro: ubuntu24.04
          - arch: ppc64le
            distro: ubuntu24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          set-safe-directory: true

      # Running autotools under emulation is slow, so do it natively.
      - name: Generate build system
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y automake libtool autotools-dev
          NOCONFIGURE=1 ./autogen.sh

      - uses: uraimo/run-on-arch-action@v3.1.0
        name: Build
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}

          githubToken: ${{ github.token }}

          install: |
            apt-get update -q -y
            apt-get install -q -y python3 git make pkg-config gcc wget xz-utils libjson-c-dev

          run: *build

  fuzzing:
    runs-on: ubuntu-latest
    name: Fuzzing
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          set-safe-directory: true
      - run: sudo docker build -t libocispec-fuzzing tests/fuzzing
      - run: sudo docker run --rm -e RUN_TIME=120 -v ${PWD}:/libocispec libocispec-fuzzing

  test_and_build_rust_bindings:
    name: test and build rust bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
      - run: cargo build --release --all-features
